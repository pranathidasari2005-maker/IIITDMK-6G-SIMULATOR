<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password | IIITDMK 6G SIMULATOR</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#edf4ff,#f5f3ff);color:#172b50}
.card{width:100%;max-width:430px;background:white;padding:38px;border-radius:18px;box-shadow:0 20px 60px #1e38601c}
h1{font-size:25px;margin:0 0 12px}p{font-size:14px;line-height:1.6;color:#78869d}
label{display:block;margin:22px 0 8px;font-size:13px;font-weight:650}
input{width:100%;height:48px;padding:0 13px;border:1px solid #dce4ef;border-radius:9px;font-size:14px}
button{width:100%;height:48px;margin-top:20px;border:0;border-radius:9px;color:white;background:linear-gradient(100deg,#1768d5,#5638bd);font-size:15px;font-weight:700;cursor:pointer}
a{color:#286bc6;text-decoration:none;font-weight:700}.back{text-align:center;margin-top:22px}
.message{margin:14px 0;padding:11px;border-radius:8px;background:#eaf8f0;color:#176b42;font-size:13px}
.error{background:#fff0f0;color:#a52828}
</style>
</head>
<body>
<main class="card">
<h1>Forgot your password?</h1>
<p>Enter the email address associated with your account. If it is registered, we'll send you a password reset link.</p>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="message {{ category }}">{{ message }}</div>
{% endfor %}
{% endwith %}
<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="email">Registered email address</label>
<input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
<button type="submit">Send Reset Link</button>
</form>
<p class="back"><a href="{{ url_for('login') }}">Back to Sign In</a></p>
</main>
</body>
</html>
